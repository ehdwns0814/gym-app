name: GymApp
options:
  deploymentTarget:
    iOS: 18.0
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete

schemes:
  GymApp:
    shared: true
    build:
      targets:
        GymApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GymAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  GymApp:
    type: application
    platform: iOS
    bundleId: com.ehdwns0814.gymapp
    sources:
      - path: Sources
        type: syncedFolder
    resources:
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ehdwns0814.gymapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0

  GymAppTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.ehdwns0814.gymapp.Tests
    sources:
      - path: Tests
        type: syncedFolder
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ehdwns0814.gymapp.Tests
    dependencies:
      - target: GymApp
